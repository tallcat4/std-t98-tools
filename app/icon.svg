<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6f43"/>
      <stop offset="1" stop-color="#12492c"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- signal arcs radiating from the antenna base -->
  <g fill="none" stroke="#eafaf0" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M64 74 a20 20 0 0 1 20 -20" stroke-width="4"/>
    <path d="M64 74 a34 34 0 0 1 34 -34" stroke-width="4" stroke-opacity="0.65"/>
    <path d="M64 74 a48 48 0 0 1 48 -48" stroke-width="4" stroke-opacity="0.4"/>
  </g>
  <!-- antenna -->
  <circle cx="64" cy="74" r="6" fill="#eafaf0"/>
  <line x1="64" y1="74" x2="64" y2="30" stroke="#eafaf0" stroke-width="4" stroke-linecap="round"/>
  <!-- 30-channel spectrum bars along the bottom -->
  <g fill="#8fe6b3">
    <rect x="20"  y="92" width="4" height="10"/>
    <rect x="28"  y="88" width="4" height="14"/>
    <rect x="36"  y="82" width="4" height="20"/>
    <rect x="44"  y="90" width="4" height="12"/>
    <rect x="52"  y="78" width="4" height="24"/>
    <rect x="60"  y="86" width="4" height="16"/>
    <rect x="68"  y="80" width="4" height="22"/>
    <rect x="76"  y="90" width="4" height="12"/>
    <rect x="84"  y="84" width="4" height="18"/>
    <rect x="92"  y="88" width="4" height="14"/>
    <rect x="100" y="92" width="4" height="10"/>
  </g>
</svg>
