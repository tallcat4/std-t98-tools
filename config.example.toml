# STD-T98 RF backend configuration (example).
#
# Copy to e.g. config.toml and pass with:
#   python std_t98_30ch_multi_rf_backend.py --config config.toml
# or point the STD_T98_BACKEND_CONFIG environment variable at it.
# Any value can also be overridden on the command line (CLI wins over the file).
#
# The backend targets USRP hardware through UHD only. All values below are the
# built-in defaults. Only the keys you change need to be present; omitted keys
# fall back to these defaults.

[sdr]
# UHD device address, appended to the device string as-is. Use it to pick one
# of several connected USRPs ("serial=00000001") or to tell UHD what it is
# talking to ("type=b200"). Leave empty to auto-select when only one USRP is
# connected. Run `uhd_find_devices` to see what is connected.
device_args = ""

# Input sample rate in Hz. The channelizer rates are derived from this, so any
# rate that keeps a 6.25 kHz PFB bin achievable will work (e.g. 2_000_000).
sample_rate = 1_200_000

# Center (tuned) frequency in Hz. STD-T98 band center: 351.29375 MHz.
center_freq = 351_293_750

# Deliberate tuning offset (Hz), applied on top of center_freq.
freq_offset = 0

# Per-device frequency error correction (Hz). Commented out on purpose: this
# is calibration for one physical radio, not a property of the hardware model,
# so a value measured on one unit is meaningless -- actively harmful -- on
# another. The demodulator turns a frequency error into a DC level on the
# symbol stream, and a few hundred Hz of DC alone is enough to push the sync
# detector past its threshold. Measure it for your own radio and set it here,
# or 0 to disable it explicitly.
#freq_err_offset = 1030

# Manual RX gain in dB. Ignored while agc = true.
tuner_gain = 30

# UHD named gain stage to drive. Leave empty ("") to set the device's overall
# gain. On a USRP B210 the element is named "PGA" (0-76 dB).
gain_element = ""

# Hardware AGC (uhd.usrp_source.set_rx_agc). Not every daughterboard supports
# it; unsupported boards are left alone rather than erroring.
agc = false

# RX antenna port. Commented out on purpose: when unset, the device's own
# default is kept, which is correct for boards with a single RX input. Boards
# with several RX ports need this -- a USRP B210 offers "TX/RX" and "RX2" and
# defaults to RX2. Starting the backend with a name the device does not have
# fails immediately and lists the valid ones.
#antenna = "RX2"

# Analog front-end bandwidth in Hz. Commented out on purpose: when unset, it
# follows sample_rate. Without that a USRP B210 stays at its full 56 MHz and
# folds megahertz of spectrum onto the 187.5 kHz that matters. Set a value to
# override, or 0 to leave the device's own setting alone.
#bandwidth = 2_000_000

[channelizer]
# 6.25 kHz STD-T98 channel raster. This is a protocol constant; changing it
# only makes sense if the standard's raster changes.
channel_spacing = 6250

# Number of decoded channels.
num_channels = 30

# PFB channel count. Must be >= num_channels. A larger value adds guard bins
# (attached to null sinks) and changes the channelizer input rate.
pfb_num_channels = 48

# Per-channel upsample factor before demodulation.
resamp2_interp = 10

[demod]
# Per-channel squelch threshold in dB. This is an ABSOLUTE level, so it depends
# on the SDR's gain and scaling: the same signal sits at different dB on
# different radios/gain settings. Too high and every channel is silently
# muted. Measure with tools/std_t98_analyse_capture.py (or the desktop GUI's
# live squelch slider) and set a value comfortably below the reported channel
# power.
squelch_threshold = -25.0

# Squelch power-averaging coefficient (1.0 = no averaging).
squelch_alpha = 1.0
